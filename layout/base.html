<html>
  <head>
    <title>{{ page.title }} | {{ site.title }}</title>
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{{{ page.relative_root }}}profile.svg">
    <link rel="stylesheet" href="{{{ page.relative_root }}}base.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>
  </head>
  <body>
    <nav>
      <ul>
        <!-- {{ site.baseurl }}{{ page.url }} -->
        {{ #site.navigation }}
        {{ site.baseurl }}{{ entry.url }}
        {{ #entry.current }}
        <li class="current"><a href="{{ site.baseurl }}{{ entry.url }}">{{ entry.title }}</a><div id="underline"></li>
        {{ /entry.current }}
        {{ ^entry.current }}
        <li><a href="{{ site.baseurl }}{{ entry.url }}">{{ entry.title }}</a></li>
        {{ /entry.current }}
        {{ /site.navigation }}
      </ul>
    </nav>
    
    {{{ content }}}
  </body>
</html>
